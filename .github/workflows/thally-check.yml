name: Docs check

on:
  pull_request:
    branches: [main]

concurrency:
  group: thally-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: thally check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install pinned workflow tooling
        run: npm ci --ignore-scripts --prefix .github/thally-tooling
      # Lints content (orphans, frontmatter), validates internal links + anchors,
      # and validates the OpenAPI spec. Emits GitHub annotations; fails on errors.
      - name: thally check
        run: .github/thally-tooling/node_modules/.bin/thally check --ci .
